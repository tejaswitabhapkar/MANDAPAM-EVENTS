{% extends "base.html" %}

{% block title %}
Register
{% endblock %}


{% block content %}

<section class="form-page">

    <div class="form-card reveal">

        <h1>
            Create Account
        </h1>

        <p>
            Start planning your next celebration.
        </p>


        <form method="post">

            <label>
                Name
            </label>

            <input
                type="text"
                name="name"
                required
            >


            <label>
                Phone Number
            </label>

            <input
                type="text"
                name="phone"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >


            <button
                class="btn primary"
                type="submit"
            >
                Register
            </button>

        </form>


        <p>

            Already registered?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
